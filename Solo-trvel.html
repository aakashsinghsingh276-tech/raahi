<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Travelers - Raahi</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <nav class="nav-bar">
            <div class="nav-content">
                <a href="explore.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 class="nav-logo">🧍 Solo Travelers</h1>
            </div>
        </nav>

        <div class="solo-travel-container">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="soloSearch" placeholder="Find solo travelers..." onkeyup="searchSoloTravelers(this.value)">
            </div>

            <div class="solo-filters">
                <button class="filter-btn active" onclick="filterSolo('all')">All</button>
                <button class="filter-btn" onclick="filterSolo('nearby')">📍 Nearby</button>
                <button class="filter-btn" onclick="filterSolo('destination')">✈️ Same Destination</button>
                <button class="filter-btn" onclick="filterSolo('budget')">💰 Budget</button>
            </div>

            <div class="solo-travelers-list" id="soloTravelersList">
                <!-- Solo travelers loaded by JavaScript -->
            </div>

            <div class="solo-tips">
                <h3>💡 Solo Travel Tips</h3>
                <div class="tip-card">
                    <i class="fas fa-shield-alt"></i>
                    <p>Always share your location with someone you trust</p>
                </div>
                <div class="tip-card">
                    <i class="fas fa-wifi"></i>
                    <p>Download offline maps before traveling</p>
                </div>
                <div class="tip-card">
                    <i class="fas fa-hands"></i>
                    <p>Join local tours to meet other solo travelers</p>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <a href="feed.html" class="bottom-nav-item"><i class="fas fa-home"></i></a>
            <a href="explore.html" class="bottom-nav-item active"><i class="fas fa-search"></i></a>
            <a href="upload.html" class="bottom-nav-item"><i class="fas fa-plus-circle"></i></a>
            <a href="chat.html" class="bottom-nav-item"><i class="fas fa-comment"></i></a>
            <a href="profile.html" class="bottom-nav-item"><i class="fas fa-user"></i></a>
        </div>
    </div>

    <script src="js/solo-travel.js"></script>
</body>
</html>
