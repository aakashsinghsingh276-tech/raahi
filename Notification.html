<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Raahi</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <nav class="nav-bar">
            <div class="nav-content">
                <a href="feed.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 class="nav-logo">🔔 Notifications</h1>
            </div>
        </nav>

        <div class="notifications-container" id="notificationsList"></div>

        <div class="bottom-nav">
            <a href="feed.html" class="bottom-nav-item"><i class="fas fa-home"></i></a>
            <a href="explore.html" class="bottom-nav-item"><i class="fas fa-search"></i></a>
            <a href="upload.html" class="bottom-nav-item"><i class="fas fa-plus-circle"></i></a>
            <a href="chat.html" class="bottom-nav-item"><i class="fas fa-comment"></i></a>
            <a href="profile.html" class="bottom-nav-item"><i class="fas fa-user"></i></a>
        </div>
    </div>

    <script>
        const Storage = {
            get(key, defaultValue = null) {
                try { const data = localStorage.getItem(key); return data ? JSON.parse(data) : defaultValue; } 
                catch { return defaultValue; }
            },
            set(key, value) {
                try { localStorage.setItem(key, JSON.stringify(value)); return true; } 
                catch { return false; }
            },
            getUser() { return this.get('raahi_user'); },
            getNotifications() { return this.get('raahi_notifications', []); },
            markAllRead() {
                const notifications = this.getNotifications();
                notifications.forEach(n => n.read = true);
                this.set('raahi_notifications', notifications);
                return notifications;
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const user = Storage.getUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            loadNotifications();
        });

        function loadNotifications() {
            const container = document.getElementById('notificationsList');
            const notifications = Storage.getNotifications();
            
            // Mark all as read
            Storage.markAllRead();

            if (notifications.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center;padding:60px 20px;color:#999;">
                        <i class="fas fa-bell" style="font-size:48px;display:block;margin-bottom:16px;"></i>
                        <p>No notifications yet.</p>
                        <p style="font-size:14px;margin-top:8px;">When someone likes, comments, or follows you, you'll see it here.</p>
                    </div>
                `;
                return;
            }

            const users = Storage.getUsers();
            container.innerHTML = notifications.map(n => {
                const user = users[n.from] || { name: n.from.split('@')[0], avatar: 'https://i.pravatar.cc/150?img=1' };
                const icon = n.type === 'like' ? '❤️' : n.type === 'comment' ? '💬' : '👤';
                return `
                    <div class="notification-item">
                        <div class="notification-avatar"><img src="${user.avatar}" alt="${user.name}"></div>
                        <div class="notification-content">
                            <div class="notification-text">
                                <strong>${user.name}</strong> ${n.message || n.type + ' your post'}
                            </div>
                            <div class="notification-time">${timeAgo(n.time)}</div>
                        </div>
                        <div class="notification-icon">${icon}</div>
                    </div>
                `;
            }).join('');
        }

        function timeAgo(date) {
            const now = new Date();
            const past = new Date(date);
            const diff = Math.floor((now - past) / 1000);
            if (diff < 60) return 'just now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
            return Math.floor(diff / 86400) + 'd ago';
        }
    </script>
</body>
</html>
