<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Buddy - Raahi</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <nav class="nav-bar">
            <div class="nav-content">
                <a href="explore.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 class="nav-logo">🤝 Travel Buddy</h1>
            </div>
        </nav>

        <div class="buddy-container">
            <div class="buddy-request-form">
                <h3>📝 Find a Travel Buddy</h3>
                <form id="buddyForm" onsubmit="postBuddyRequest(event)">
                    <div class="form-group">
                        <i class="fas fa-map-pin"></i>
                        <input type="text" id="buddyDestination" placeholder="Where are you going?" required>
                    </div>
                    <div class="form-group">
                        <i class="fas fa-calendar"></i>
                        <input type="date" id="buddyDate" required>
                    </div>
                    <div class="form-group">
                        <i class="fas fa-users"></>
                        <select id="buddyCount">
                            <option value="1">1 person</option>
                            <option value="2">2 people</option>
                            <option value="3">3 people</option>
                            <option value="4">4+ people</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <i class="fas fa-pen"></i>
                        <textarea id="buddyMessage" placeholder="Tell about your travel plans..." rows="2"></textarea>
                    </div>
                    <button type="submit" class="btn-primary">Find Buddy</button>
                </form>
            </div>

            <div class="buddy-requests" id="buddyRequests">
                <!-- Buddy requests loaded by JavaScript -->
            </div>
        </div>

        <div class="bottom-nav">
            <a href="feed.html" class="bottom-nav-item"><i class="fas fa-home"></i></a>
            <a href="explore.html" class="bottom-nav-item active"><i class="fas fa-search"></i></a>
            <a href="upload.html" class="bottom-nav-item"><i class="fas fa-plus-circle"></i></a>
            <a href="chat.html" class="bottom-nav-item"><i class="fas fa-comment"></i></a>
            <a href="profile.html" class="bottom-nav-item"><i class="fas fa-user"></i></a>
        </div>
    </div>

    <script src="js/travel-buddy.js"></script>
</body>
</html>
