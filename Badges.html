<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badges - Raahi</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <nav class="nav-bar">
            <div class="nav-content">
                <a href="profile.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 class="nav-logo">🏆 Badges</h1>
            </div>
        </nav>

        <div class="badges-container" id="badgesContainer">
            <!-- Badges loaded by JavaScript -->
        </div>

        <div class="bottom-nav">
            <a href="feed.html" class="bottom-nav-item"><i class="fas fa-home"></i></a>
            <a href="explore.html" class="bottom-nav-item"><i class="fas fa-search"></i></a>
            <a href="upload.html" class="bottom-nav-item"><i class="fas fa-plus-circle"></i></a>
            <a href="chat.html" class="bottom-nav-item"><i class="fas fa-comment"></i></a>
            <a href="profile.html" class="bottom-nav-item active"><i class="fas fa-user"></i></a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = Storage.getUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            
            const badges = BadgeSystem.getUserBadgesWithDetails(user.email);
            const container = document.getElementById('badgesContainer');
            
            let html = `
                <div style="margin-bottom:16px;">
                    <h3>🎯 Your Achievements</h3>
                    <p style="color:#999;font-size:14px;">${badges.filter(b => b.unlocked).length} of ${badges.length} unlocked</p>
                </div>
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;">
            `;
            
            badges.forEach(badge => {
                html += `
                    <div style="background:${badge.unlocked ? '#f0f8f0' : '#f5f5f5'};padding:16px;border-radius:12px;text-align:center;border:${badge.unlocked ? '2px solid #4CAF50' : '1px solid #e0e0e0'};opacity:${badge.unlocked ? '1' : '0.5'};">
                        <div style="font-size:32px;margin-bottom:8px;">${badge.unlocked ? badge.icon : '🔒'}</div>
                        <div style="font-weight:bold;font-size:14px;">${badge.name}</div>
                        <div style="font-size:11px;color:#999;margin-top:4px;">${badge.description}</div>
                        ${badge.unlocked ? '<div style="margin-top:8px;font-size:11px;color:#4CAF50;">✅ Unlocked</div>' : '<div style="margin-top:8px;font-size:11px;color:#999;">🔒 Locked</div>'}
                    </div>
                `;
            });
            
            html += `</div>`;
            container.innerHTML = html;
        });
    </script>
</body>
</html>
