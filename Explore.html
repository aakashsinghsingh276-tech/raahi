<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore - Raahi</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <nav class="nav-bar">
            <div class="nav-content">
                <h1 class="nav-logo">🔍 Explore</h1>
            </div>
        </nav>

        <div class="explore-container">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search places, users, hashtags..." onkeyup="filterContent(this.value)">
            </div>

            <div class="category-tabs">
                <button class="category-tab active" onclick="filterCategory('all')">All</button>
                <button class="category-tab" onclick="filterCategory('popular')">⭐ Popular</button>
                <button class="category-tab" onclick="filterCategory('recent')">🕐 Recent</button>
            </div>

            <div class="explore-grid" id="exploreGrid"></div>
        </div>

        <div class="bottom-nav">
            <a href="feed.html" class="bottom-nav-item"><i class="fas fa-home"></i></a>
            <a href="explore.html" class="bottom-nav-item active"><i class="fas fa-search"></i></a>
            <a href="upload.html" class="bottom-nav-item"><i class="fas fa-plus-circle"></i></a>
            <a href="chat.html" class="bottom-nav-item"><i class="fas fa-comment"></i></a>
            <a href="profile.html" class="bottom-nav-item"><i class="fas fa-user"></i></a>
        </div>
    </div>

    <script>
        const Storage = {
            get(key, defaultValue = null) {
                try { const data = localStorage.getItem(key); return data ? JSON.parse(data) : defaultValue; } 
                catch { return defaultValue; }
            },
            getUser() { return this.get('raahi_user'); },
            getPosts() { return this.get('raahi_posts', []); },
            getUsers() { return this.get('raahi_users', {}); }
        };

        let allPosts = [];

        document.addEventListener('DOMContentLoaded', () => {
            const user = Storage.getUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            loadExplore();
        });

        function loadExplore(filter = 'all', search = '') {
            const grid = document.getElementById('exploreGrid');
            allPosts = Storage.getPosts();
            const users = Storage.getUsers();

            let filtered = [...allPosts];

            // Filter by search
            if (search) {
                const s = search.toLowerCase();
                filtered = filtered.filter(p => {
                    const user = users[p.userEmail];
                    const caption = (p.caption || '').toLowerCase();
                    const hashtags = (p.hashtags || '').toLowerCase();
                    const name = (user?.name || '').toLowerCase();
                    return caption.includes(s) || hashtags.includes(s) || name.includes(s);
                });
            }

            // Filter by category
            if (filter === 'popular') {
                filtered.sort((a, b) => b.likes - a.likes);
            } else if (filter === 'recent') {
                filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            }

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column:1/-1; text-align:center; padding:40px; color:#999;">
                        <i class="fas fa-search" style="font-size:48px; display:block; margin-bottom:12px;"></i>
                        <p>No posts found.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(post => {
                const user = users[post.userEmail] || { name: 'User', avatar: 'https://i.pravatar.cc/150?img=1' };
                return `
                    <div class="explore-item" onclick="window.location.href='feed.html'">
                        <img src="${post.image}" alt="${post.caption || 'Travel post'}">
                        <div class="overlay">
                            <span><i class="fas fa-heart"></i> ${post.likes}</span>
                            <span><i class="fas fa-comment"></i> ${post.comments?.length || 0}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterContent(value) {
            const activeTab = document.querySelector('.category-tab.active');
            const filter = activeTab ? activeTab.textContent.toLowerCase() : 'all';
            if (filter === 'all') loadExplore('all', value);
            else if (filter.includes('popular')) loadExplore('popular', value);
            else if (filter.includes('recent')) loadExplore('recent', value);
        }

        function filterCategory(category) {
            document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.category-tab[onclick*="${category}"]`).classList.add('active');
            const search = document.getElementById('searchInput').value;
            loadExplore(category, search);
        }
    </script>
</body>
</html>
