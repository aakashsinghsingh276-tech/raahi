        <!-- Feed -->
        <div class="feed-posts" id="feedPosts"></div>

        <!-- Bottom Nav -->
        <div class="bottom-nav">
            <a href="feed.html" class="bottom-nav-item active"><i class="fas fa-home"></i></a>
            <a href="explore.html" class="bottom-nav-item"><i class="fas fa-search"></i></a>
            <a href="upload.html" class="bottom-nav-item"><i class="fas fa-plus-circle"></i></a>
            <a href="chat.html" class="bottom-nav-item"><i class="fas fa-comment"></i></a>
            <a href="profile.html" class="bottom-nav-item"><i class="fas fa-user"></i></a>
        </div>
    </div>

    <script>
        // ============ REAL STORAGE ============
        const Storage = {
            get(key, defaultValue = null) {
                try { const data = localStorage.getItem(key); return data ? JSON.parse(data) : defaultValue; } 
                catch { return defaultValue; }
            },
            set(key, value) {
                try { localStorage.setItem(key, JSON.stringify(value)); return true; } 
                catch { return false; }
            },
            getUser() { return this.get('raahi_user'); },
            getUsers() { return this.get('raahi_users', {}); },
            getPosts() { return this.get('raahi_posts', []); },
            getChats() { return this.get('raahi_chats', {}); },
            
            addPost(post) {
                const posts = this.getPosts();
                const newPost = {
                    id: Date.now(),
                    ...post,
                    createdAt: new Date().toISOString(),
                    likes: 0,
                    liked: false,
                    comments: [],
                    shares: 0
                };
                posts.unshift(newPost);
                this.set('raahi_posts', posts);
                return newPost;
            },
            
            likePost(postId) {
                const posts = this.getPosts();
                const post = posts.find(p => p.id === postId);
                if (post) {
                    post.liked = !post.liked;
                    post.likes += post.liked ? 1 : -1;
                    this.set('raahi_posts', posts);
                }
                return post;
            },
            
            addComment(postId, comment) {
                const posts = this.getPosts();
                const post = posts.find(p => p.id === postId);
                if (post) {
                    post.comments.push({ id: Date.now(), ...comment, createdAt: new Date().toISOString() });
                    this.set('raahi_posts', posts);
                }
                return post;
            },
            
            followUser(userEmail) {
                const currentUser = this.getUser();
                if (!currentUser) return null;
                
                const users = this.getUsers();
                if (users[userEmail]) {
                    if (!users[userEmail].followers) users[userEmail].followers = [];
                    if (!users[currentUser.email].following) users[currentUser.email].following = [];
                    
                    const index = users[userEmail].followers.indexOf(currentUser.email);
                    if (index === -1) {
                        users[userEmail].followers.push(currentUser.email);
                        users[currentUser.email].following.push(userEmail);
                    } else {
                        users[userEmail].followers.splice(index, 1);
                        users[currentUser.email].following.splice(users[currentUser.email].following.indexOf(userEmail), 1);
                    }
                    this.set('raahi_users', users);
                }
                return users;
            },
            
            sendMessage(to, text) {
                const user = this.getUser();
                if (!user) return null;
                
                const chats = this.getChats();
                const key = [user.email, to].sort().join('_');
                if (!chats[key]) chats[key] = [];
                
                const message = {
                    id: Date.now(),
                    from: user.email,
                    to: to,
                    text: text,
                    time: new Date().toISOString(),
                    read: false
                };
                chats[key].push(message);
                this.set('raahi_chats', chats);
                return message;
            },
            
            getChatHistory(withUser) {
                const user = this.getUser();
                if (!user) return [];
                const chats = this.getChats();
                const key = [user.email, withUser].sort().join('_');
                return chats[key] || [];
            },
            
            getNotifications() {
                return this.get('raahi_notifications', []);
            },
            
            addNotification(notification) {
                const notifications = this.getNotifications();
                notifications.unshift({ id: Date.now(), ...notification, time: new Date().toISOString(), read: false });
                this.set('raahi_notifications', notifications);
                return notifications;
            }
        };

        // ============ REAL USER SESSION ============
        let currentUser = null;
        let allPosts = [];

        document.addEventListener('DOMContentLoaded', () => {
            currentUser = Storage.getUser();
            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }
            initDemoUsers();
            loadStories();
            loadPosts();
            updateNotificationBadge();
        });

        // ============ REAL DEMO USERS (Only for first-time) ============

            if (Object.keys(users).length > 1) return;

            const demoUsers = [
                { email: 'sarah@raahi.com', name: 'Sarah Mary', username: 'sarah_travels', avatar: 'https://i.pravatar.cc/150?img=1' },
                { email: 'marko@raahi.com', name: 'Marko Kovač', username: 'marko_adventures', avatar: 'https://i.pravatar.cc/150?img=2' },
                { email: 'luka@raahi.com', name: 'Luka Babić', username: 'luka_explorer', avatar: 'https://i.pravatar.cc/150?img=3' },
                { email: 'jessica@raahi.com', name: 'Jessica Bright', username: 'jessica_wanderlust', avatar: 'https://i.pravatar.cc/150?img=4' }
            ];

            demoUsers.forEach(u => {
                if (!users[u.email]) {
                    users[u.email] = {
                        name: u.name,
                        username: u.username,
                        password: 'demo123',

                }
            });

            // Add demo user if not exists
            if (!users['demo@raahi.com']) {
                users['demo@raahi.com'] = {
                    name: 'Alex Morgan',
                    username: 'alex_morgan',
                    password: 'demo123',
                    avatar: 'https://i.pravatar.cc/150?img=7',
                    joined: new Date().toISOString(),
                    followers: ['sarah@raahi.com', 'marko@raahi.com'],
                    following: ['sarah@raahi.com', 'marko@raahi.com', 'luka@raahi.com']
                };
            }

            Storage.set('raahi_users', users);

            // Add demo posts if none
            const posts = Storage.getPosts();
            if (posts.length === 0) {
                const images = [

                    'https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=600&h=400',
                    'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=600&h=400'
                ];
                const captions = [
                    'Can\'t wait for my holiday to Bali! 🌴 #travel #bali',
                    'The weather is so nice today! 🏖️ #beach #summer',

                        likes: Math.floor(Math.random() * 50) + 10,

                            { user: usersList[(i+1) % usersList.length], name: users[usersList[(i+1) % usersList.length]].name, text: 'Amazing! 😍' },

        }

        // ============ REAL STORIES ============
        function loadStories() {
            const container = document.getElementById('storiesRow');
            if (!container) return;

            const users = Storage.getUsers();
            const user = Storage.getUser();
            
            let html = `
                <div class="story-item" onclick="addStory()">
                    <div class="story-avatar" style="border-color:#FF5A5F; position:relative;">
                        <img src="${user.avatar}" alt="Your Story">
                        <div style="position:absolute; bottom:-2px; right:-2px; background:#FF5A5F; color:#fff; border-radius:50%; width:20px; height:20px; display:flex; align-items:center; justify-content:center; font-size:12px; border:2px solid #fff;">+</div>
                    </div>
                    <span class="story-name">Your Story</span>
                </div>
            `;

            Object.keys(users).slice(0, 10).forEach(email => {
                if (email !== user.email) {
                    const u = users[email];
                    html += `
                        <div class="story-item" onclick="viewStory('${email}')">
                            <div class="story-avatar">
                                <img src="${u.avatar}" alt="${u.name}">
                            </div>
                            <span class="story-name">${u.name.split(' ')[0]}</span>
                        </div>
                    `;
                }
            });

            container.innerHTML = html;
        }

        function addStory() {
            alert('📸 Upload your story! (Coming soon)');
        }

        function viewStory(email) {
            alert(`📸 Viewing ${email}'s story`);
        }

        // ============ REAL FEED ============
        function loadPosts() {
            allPosts = Storage.getPosts();
            const container = document.getElementById('feedPosts');
            if (!container) return;

            if (allPosts.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center;padding:40px;color:#999;">
                        <i class="fas fa-camera" style="font-size:48px;display:block;margin-bottom:12px;"></i>
                        <p>No posts yet. Be the first to share!</p>
                        <button onclick="window.location.href='upload.html'" style="margin-top:12px;padding:10px 24px;background:#FF5A5F;color:#fff;border:none;border-radius:20px;cursor:pointer;">Upload Now</button>
                    </div>
                `;
                return;
            }

            container.innerHTML = allPosts.map(post => createPostHTML(post)).join('');

            // REAL event listeners
            document.querySelectorAll('.like-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const postId = parseInt(this.dataset.postId);
                    handleLike(postId);
                });
            });

            document.querySelectorAll('.comment-submit').forEach(btn => {
                btn.addEventListener('click', function() {
                    const postId = parseInt(this.dataset.postId);
                    const input = document.getElementById(`comment-input-${postId}`);
                    if (input && input.value.trim()) {
                        handleComment(postId, input.value);
                        input.value = '';
                    }
                });
            });

            document.querySelectorAll('.comment-input').forEach(input => {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        const postId = parseInt(this.dataset.postId);
                        if (this.value.trim()) {
                            handleComment(postId, this.value);
                            this.value = '';
                        }
                    }
                });
            });

            document.querySelectorAll('.follow-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const email = this.dataset.email;
                    handleFollow(email);
                });
            });

            document.querySelectorAll('.share-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const postId = parseInt(this.dataset.postId);
                    handleShare(postId);
                });
            });

            document.querySelectorAll('.save-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const postId = parseInt(this.dataset.postId);
                    handleSave(postId);
                });
            });
        }

        // ============ REAL POST HTML ============
        function createPostHTML(post) {
            const users = Storage.getUsers();
            const user = users[post.userEmail] || { name: post.userEmail.split('@')[0], avatar: 'https://i.pravatar.cc/150?img=1' };
            const currentUser = Storage.getUser();
            const isLiked = post.liked || false;
            const isFollowing = users[currentUser.email]?.following?.includes(post.userEmail) || false;

            return `
                <div class="post-card" data-post-id="${post.id}">
                    <div class="post-header">
                        <div class="post-avatar">
                            <img src="${user.avatar}" alt="${user.name}">
                        </div>
                        <span class="post-user">${user.name}</span>
                        <span class="post-time">${timeAgo(post.createdAt)}</span>
                        <button class="follow-btn" data-email="${post.userEmail}" style="background:none;border:none;color:#FF5A5F;font-weight:600;cursor:pointer;font-size:13px;margin-left:auto;">
                            ${isFollowing ? 'Following' : 'Follow'}
                        </button>
                    </div>
                    
                    ${post.image ? `<img src="${post.image}" class="post-image" alt="Travel post">` : ''}
                    
                    <div class="post-actions">
                        <div class="post-actions-left">
                            <button class="post-action-btn like-btn ${isLiked ? 'liked' : ''}" data-post-id="${post.id}">
                                <i class="fas fa-heart"></i>
                            </button>
                            <button class="post-action-btn" onclick="document.getElementById('comment-input-${post.id}').focus()">
                                <i class="fas fa-comment"></i>
                            </button>
                            <button class="post-action-btn share-btn" data-post-id="${post.id}">
                                <i class="fas fa-share"></i>
                            </button>
                        </div>
                        <button class="post-action-btn save-btn" data-post-id="${post.id}">
                            <i class="fas fa-bookmark"></i>
                        </button>
                    </div>
                    
                    <div class="post-likes" id="likes-${post.id}">
                        <span class="like-count">${post.likes}</span> likes
                    </div>
                    
                    <div class="post-caption">
                        <strong>${user.name}</strong> ${post.caption || ''}
                    </div>
                    
                    ${post.hashtags ? `<div class="post-hashtags">${post.hashtags}</div>` : ''}
                    
                    ${post.comments && post.comments.length > 0 ? `
                        <div class="post-comments" onclick="showAllComments(${post.id})">
                            View all ${post.comments.length} comments
                        </div>
                        ${post.comments.slice(0, 2).map(c => `
                            <div class="post-comment">
                                <strong>${c.name || c.user}</strong> ${c.text}
                            </div>
                        `).join('')}
                    ` : ''}
                    
                    <div style="display:flex; padding:8px 16px; gap:8px;">
                        <input type="text" id="comment-input-${post.id}" class="comment-input" data-post-id="${post.id}" placeholder="Add a comment..." style="flex:1; padding:8px 12px; border:1px solid #dbdbdb; border-radius:20px; outline:none; font-size:14px;">
                        <button class="comment-submit" data-post-id="${post.id}" style="background:none; border:none; color:#FF5A5F; font-weight:600; cursor:pointer;">Post</button>
                    </div>
                    
                    <div class="post-time-ago">${timeAgo(post.createdAt)}</div>
                </div>
            `;
        }

        // ============ REAL INTERACTIONS ============
        function handleLike(postId) {
            const post = S
