<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Raahi</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <nav class="nav-bar">
            <div class="nav-content">
                <a href="profile.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 class="nav-logo">✏️ Edit Profile</h1>
            </div>
        </nav>

        <div class="edit-profile-container">
            <div class="profile-avatar-edit">
                <img id="editAvatar" src="" alt="Profile">
                <button onclick="changeAvatar()" class="change-avatar-btn">
                    <i class="fas fa-camera"></i>
                </button>
            </div>

            <form id="editProfileForm" onsubmit="saveProfile(event)">
                <div class="form-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="editName" placeholder="Full Name" required>
                </div>
                <div class="form-group">
                    <i class="fas fa-at"></i>
                    <input type="text" id="editUsername" placeholder="Username" required>
                </div>
                <div class="form-group">
                    <i class="fas fa-map-pin"></i>
                    <input type="text" id="editLocation" placeholder="Current Location">
                </div>
                <div class="form-group">
                    <i class="fas fa-globe"></i>
                    <select id="editLanguage">
                        <option value="en">English</option>
                        <option value="hi">हिन्दी (Hindi)</option>
                        <option value="es">Español</option>
                        <option value="fr">Français</option>
                    </select>
                </div>
                <div class="form-group">
                    <i class="fas fa-pen"></i>
                    <textarea id="editBio" placeholder="Write something about yourself..." rows="3"></textarea>
                </div>
                <div class="form-group">
                    <i class="fas fa-tag"></i>
                    <input type="text" id="editInterests" placeholder="Interests (e.g., Photography, Hiking)">
                </div>
                
                <div class="form-group">
                    <label>Travel Style:</label>
                    <div class="travel-style-options">
                        <label><input type="checkbox" value="solo"> 🧍 Solo</label>
                        <label><input type="checkbox" value="couple"> 💑 Couple</label>
                        <label><input type="checkbox" value="family"> 👨‍👩‍👧‍👦 Family</label>
                        <label><input type="checkbox" value="adventure"> 🏔️ Adventure</label>
                        <label><input type="checkbox" value="business"> 💼 Business</label>
                    </div>
                </div>

                <button type="submit" class="btn-primary save-btn">
                    <i class="fas fa-save"></i> Save Changes
                </button>
            </form>

            <div style="margin-top:20px; border-top:1px solid #dbdbdb; padding-top:20px;">
                <button onclick="deleteAccount()" class="delete-account-btn">
                    <i class="fas fa-trash"></i> Delete Account
                </button>
            </div>
        </div>

        <div class="bottom-nav">
            <a href="feed.html" class="bottom-nav-item"><i class="fas fa-home"></i></a>
            <a href="explore.html" class="bottom-nav-item"><i class="fas fa-search"></i></a>
            <a href="upload.html" class="bottom-nav-item"><i class="fas fa-plus-circle"></i></a>
            <a href="chat.html" class="bottom-nav-item"><i class="fas fa-comment"></i></a>
            <a href="profile.html" class="bottom-nav-item active"><i class="fas fa-user"></i></a>
        </div>
    </div>

    <script src="js/profile-edit.js"></script>
</body>
</html>
